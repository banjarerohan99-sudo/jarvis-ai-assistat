
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
body {
  margin: 0;
  background: #050b16;
  color: #00d9ff;
  font-family: Arial;
  text-align: center;
}
h1 {
  margin-top: 60px;
  letter-spacing: 5px;
}
.circle {
  width: 180px;
  height: 180px;
  border: 3px solid #00d9ff;
  border-radius: 50%;
  margin: 50px auto;
  box-shadow: 0 0 25px #00d9ff;
  display: grid;
  place-items: center;
  font-size: 25px;
}
p { color: white; }
button {
  background: #00d9ff;
  border: none;
  padding: 14px 30px;
  border-radius: 25px;
  font-size: 16px;
}
</style>
</head>
<body>
<h1>J.A.R.V.I.S</h1>
<p>PERSONAL AI ASSISTANT</p>
<div class="circle">JARVIS</div>
<p id="status">SYSTEM ONLINE</p>
<button onclick="start()">START SYSTEM</button>
<script>
function start() {
  document.getElementById("status").innerText =
  "JARVIS ACTIVATED";
}
</script>
</body>
  </html>
